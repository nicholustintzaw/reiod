url: https://nicholustintzaw.github.io/reiod/

template:
  bootstrap: 5
  bslib:
    primary: "#2a6f4e"

home:
  title: Dietary environmental impact metrics for R
  description: >
    Implements the absolute threshold, relative benchmark and composite dietary
    environmental impact metrics defined in Intake's Environmental Impacts of
    Foods methods paper. Age- and sex-specific cut-offs, a data quality check
    suite, and no dependencies.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
        - text: Before you compute
        - text: 1. Check your data first
          href: articles/data-checks.html
        - text: 2. Demographic groups
          href: articles/demographic-groups.html
        - text: ---------
        - text: The metrics, table by table
        - text: 3. Table 3 — absolute thresholds
          href: articles/table3-absolute.html
        - text: 4. Tables 4a–4g — relative benchmarks
          href: articles/table4-relative.html
        - text: 5. Tables 5a & 5b — composite metrics
          href: articles/table5-composites.html
        - text: ---------
        - text: Reference notes
        - text: The precision pre-flight check
          href: articles/precision.html
        - text: A broken dataset, fault by fault
          href: articles/troubleshooting.html
        - text: "Eutrophication: a corrected cut-off"
          href: articles/eutrophication.html

articles:
  - title: Before you compute
    desc: >
      Run these first. Everything else assumes your impact values are the
      right type, the right unit and the right precision.
    contents:
      - data-checks
      - demographic-groups

  - title: The metrics, table by table
    desc: >
      One article per table family. Each works through a single value, a
      column from a dataset, adding results to a data frame, all seven
      indicators at once, and only the indicators you have.
    contents:
      - table3-absolute
      - table4-relative
      - table5-composites

  - title: Reference notes
    desc: Deeper background on three things that catch people out.
    contents:
      - precision
      - troubleshooting
      - eutrophication

reference:
  - title: Demographic group
    desc: >
      The eight-category age and sex variable every cut-off is scaled by.
      Required by all the metric functions.
    contents:
      - eiod_age_sex_group
      - eiod_as_sex_factor

  - title: Metrics
    desc: The three metric families from the methods paper.
    contents:
      - eiod_absolute_threshold
      - eiod_relative_band
      - eiod_absolute_all
      - eiod_relative_all
      - eiod_hesd
      - eiod_hdlei

  - title: Decomposed sub-indicators
    desc: >
      The individual criteria behind the composite metrics, exported so each
      can be reported on its own.
    contents:
      - eiod_healthy_diet
      - eiod_sustainable_diet
      - eiod_low_impact

  - title: Data quality checks
    desc: >
      Run these before computing anything. They report rather than stop, so one
      pass finds every problem.
    contents:
      - eiod_check_data
      - eiod_check_impact
      - eiod_check_precision
      - eiod_check_magnitude
      - eiod_check_demographics
      - eiod_check_gdqs

  - title: Reference lookups
    contents:
      - eiod_list_indicators
      - eiod_lookup_cutoff

  - title: Data
    contents:
      - eiod_cutoffs
      - eiod_indicators
      - eiod_demo
      - eiod_demo_map

  - title: Package
    contents:
      - reiod-package
