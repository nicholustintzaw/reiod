name: pkgcheck

# This will cancel running jobs once a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

# Manual only for now: the action crashes while writing its markdown summary
# (ropensci-review-tools/pkgcheck#444) whenever the other CI workflows pass.
# pkgcheck-summary.yaml runs the same checks on every push meanwhile. Restore
# the push trigger below once #444 is fixed.
on:
  # Manually trigger the Action under Actions/pkgcheck
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: ropensci-review-tools/pkgcheck-action@main
